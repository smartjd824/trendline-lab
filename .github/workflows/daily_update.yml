name: TrendLine 하루 2회 갱신 & 텔레그램 알림 (아침 미국·코인 / 오후 한국·종합)

on:
  schedule:
    # GitHub 예약 실행은 정각 혼잡으로 수십 분 늦게 시작될 수 있어(실측 최대 77분) 목표보다 일찍, 정각을 피해 예약
    - cron: "47 22 * * *"  # 매일 07:47 KST 예약 → 08:30 전후 도착: 아침 리포트 (미국 전일 종가 + 코인 일봉 마감 직전)
    - cron: "37 5 * * 1-5" # 평일 14:37 KST 예약 → 15:00 전후 도착: 오후 종합 리포트 (한국 장중 예비 종가)
  workflow_dispatch:
    inputs:
      session:
        description: "리포트 종류 (AUTO=시간에 맞춰 자동)"
        type: choice
        options: [AUTO, MORNING, AFTERNOON]
        default: AUTO
      notify:
        description: "텔레그램 알림 보내기 (끄면 사이트만 갱신)"
        type: boolean
        default: true

permissions:
  contents: write  # track/forward_log.csv 커밋 (실전 검증 기록 + 60일 무활동 자동중지 방지)
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-alert:
    name: 데이터 갱신·리포트·알림
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 리포트 종류 결정 (아침 MORNING / 오후 AFTERNOON)
        run: |
          S="${{ github.event.inputs.session }}"
          if [ "${{ github.event.schedule }}" = "47 22 * * *" ]; then S=MORNING; fi
          if [ "${{ github.event.schedule }}" = "37 5 * * 1-5" ]; then S=AFTERNOON; fi
          if [ -z "$S" ] || [ "$S" = "AUTO" ]; then
            H=$(TZ=Asia/Seoul date +%H); if [ "$H" -lt 12 ]; then S=MORNING; else S=AFTERNOON; fi
          fi
          echo "REPORT_SESSION=$S" >> "$GITHUB_ENV"
          # 오후: 한국 장중 봉을 '예비 종가'로 사용 (코인·미국은 확정 봉만)
          if [ "$S" = "AFTERNOON" ]; then echo "TRENDLINE_PARTIAL_OK=KR" >> "$GITHUB_ENV"; fi
          echo "리포트=$S (KST $(TZ=Asia/Seoul date '+%F %H:%M'))"

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 파이썬 패키지 설치
        run: uv sync

      - name: 최근 7.6년 시세 내려받기
        run: |
          uv run python -c "from backend.data_loader import fetch_and_cache_symbols; res = fetch_and_cache_symbols(years=7.6, force=True); print('Updated:', len(res['updated']), 'Failed:', len(res['failed']))"

      - name: 웹 대시보드 만들기 (docs)
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: uv run python build_static_site.py

      - name: 텔레그램 알림 발송 + 모의 성과 기록
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.notify != 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MY_HOLDINGS_JSON: ${{ secrets.MY_HOLDINGS_JSON }}  # 웹 '내 보유종목' 백업 JSON (비공개 보관)
        run: uv run python cloud_alert.py

      - name: 모의 성과 기록 커밋
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.notify != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add track/forward_log.csv
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
          git commit -m "모의 포트폴리오 실전 기록 ${REPORT_SESSION} $(TZ=Asia/Seoul date '+%F %H:%M')"
          git pull --rebase --autostash || true
          git push || echo "::warning::모의 성과 기록 push 실패"

      - name: 웹페이지 파일 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: 웹페이지 배포
    runs-on: ubuntu-latest
    needs: build-and-alert
    steps:
      - name: 웹페이지 배포
        id: deployment
        uses: actions/deploy-pages@v4
