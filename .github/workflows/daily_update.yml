name: Daily 10AM KST TrendLine Update & Telegram Alert

on:
  schedule:
    # 01:00 UTC == 매일 오전 10:00 KST (한국 시간)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Run core regression tests
        run: uv run pytest -q

      - name: Fetch latest 7.6-year market data (250 themed assets)
        run: |
          uv run python -c "from backend.data_loader import fetch_and_cache_symbols; res = fetch_and_cache_symbols(years=7.6, force=True); print('Updated:', len(res['updated']), 'Failed:', len(res['failed']))"

      - name: Build static web dashboard into ./docs
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: uv run python build_static_site.py

      - name: Send daily Telegram / Discord alert from cloud
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run python -c "
          import os
          from backend.scanner import scan_all_assets, format_full_alert_report
          from backend.notifier import dispatch_alerts

          tg_token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          tg_chat = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          dc_url = os.environ.get('DISCORD_WEBHOOK_URL', '').strip()

          if not (tg_token and tg_chat) and not dc_url:
              print('No cloud alert secrets configured — skipping cloud notification.')
              raise SystemExit(0)

          scan = scan_all_assets(strategy_id='AUTO_BEST')
          title, full_text, mac_sum, triggered = format_full_alert_report(scan, include_near=True)
          cfg = {
              'macos_enabled': False,
              'telegram_enabled': bool(tg_token and tg_chat),
              'telegram_bot_token': tg_token,
              'telegram_chat_id': tg_chat,
              'discord_enabled': bool(dc_url),
              'discord_webhook_url': dc_url,
          }
          res = dispatch_alerts(title, full_text, cfg)
          print('Cloud Alert Results:', res)
          "

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-alert
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
